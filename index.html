<Section no="08" title="Evidence-Based Management" lead="EBM prevents the organization from optimizing only what is easy to count. It combines present performance, future opportunity, speed and organizational capability."><div className="grid four">{d.ebm.map((x,i)=><div className="card ebm-card" key={i}><span className="tag">EBM 0{i+1}</span><h3>{x[0]}</h3><p>{x[1]}</p><br/><p><strong>Illustrative measures</strong><br/>{x[2]}</p></div>)}</div></Section>
<Section no="09" title="Which metrics and KPIs can this function affect?" lead="The department does not 'own' every KPI. It improves the decision system, visibility, prioritization and governance that influence these outcomes. Actual baselines, owners and causal links must be validated."><div style={{overflowX:"auto"}}><table className="kpi-table"><thead><tr><th>Outcome area</th><th>Illustrative KPI / metric</th><th>Primary collaboration</th><th>How the function affects it</th></tr></thead><tbody>{d.kpis.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{j===0?<strong>{c}</strong>:c}</td>)}</tr>)}</tbody></table></div></Section>
<Section no="10" title="First proof of value: six-month pilot" lead="Start with a narrow, decision-relevant pilot. The objective is not to build a perfect data warehouse; it is to prove that better evidence changes a real management decision."><div className="card" style={{background:"linear-gradient(135deg,#102a43,#164e63)",color:"white",padding:35}}><span className="tag">Pilot scope</span><h2 style={{color:"white",marginTop:15}}>Business Value Intelligence</h2><div className="grid three">{["Product profitability","Cost per gram / unit","Bottleneck impact","Portfolio visibility","Export-market analysis","Executive decision briefs"].map((x,i)=><div className="card" key={i}><h3>{x}</h3><p>Illustrative workstream to connect evidence with a concrete decision.</p></div>)}</div></div></Section>
<Section no="11" title="Two-year roadmap"><div className="roadmap">{d.roadmap.map((p,i)=><div className="card phase" key={i}><div className="phase-time">{p[0]}</div><h3>{p[1]}</h3><ul>{p[2].map((x,j)=><li key={j}>{x}</li>)}</ul></div>)}</div></Section>
<Section no="12" title="Target state after two years"><div className="grid three">{d.target.map((x,i)=><div className="card" key={i}><div className="number">✓</div><h3>{x}</h3></div>)}</div></Section>
<Section no="13" title="Proposed Corporate Governance department hierarchy" lead="A CEO-connected enterprise function that integrates strategy, execution intelligence, digital enablement and organizational learning.">
<div className="orgchart">
  <div className="org-root"><div className="org-node"><span className="org-badge" style={{background:"#28566b",color:"white"}}>ENTERPRISE LEADERSHIP</span><h3>Corporate Governance</h3><p>Enterprise alignment · strategic outcomes · decision quality · value realization</p></div></div>
  <div className="org-children">
    <div className="org-child"><div className="org-node"><span className="org-badge">01</span><h3>PMO</h3><p>Portfolio delivery, project governance, dependencies, milestones and execution discipline.</p></div></div>
    <div className="org-child"><div className="org-node"><span className="org-badge">02</span><h3>BI</h3><p>Management information, dashboards, data models, KPI visibility and business-value analytics.</p></div></div>
    <div className="org-child"><div className="org-node"><span className="org-badge">03</span><h3>AI</h3><p>Decision augmentation, intelligent automation, predictive insights and responsible AI adoption.</p></div></div>
    <div className="org-child"><div className="org-node"><span className="org-badge">04</span><h3>Knowledge Management</h3><p>Institutional memory, knowledge systems, lessons learned and reusable organizational intelligence.</p></div></div>
    <div className="org-child"><div className="org-node"><span className="org-badge">05</span><h3>Process Management</h3><p>Process architecture, improvement, standardization, controls and cross-functional flow.</p></div></div>
  </div>
  <div className="org-note"><strong>Operating principle:</strong> Corporate Governance sets the management system and enables better enterprise decisions. Each capability partners with functional leaders; it does not replace Finance, R&D, Operations, Regulatory, Commercial, HR or IT ownership.</div>
</div>
</Section>
<Section no="14" title="Organizational position"><div className="grid two"><div className="card" style={{textAlign:"center",background:"var(--navy)",color:"white"}}><h2 style={{color:"white",fontSize:32}}>CEO</h2><p style={{color:"#d9e2ec"}}>Enterprise direction and decision authority</p><div style={{fontSize:30,margin:20}}>↓</div><h2 style={{color:"white",fontSize:28}}>Corporate Strategy & Governance</h2><p style={{color:"#d9e2ec"}}>Strategy · intelligence · portfolio choices · value realization · executive decision support</p></div><div className="card"><h3>Distinct from PMO</h3><p>PMO primarily strengthens delivery discipline, project governance, dependencies and execution visibility. Corporate Strategy & Governance focuses on enterprise choices, strategic coherence, value realization, resource trade-offs and adaptation.</p><br/><h3>Design principle</h3><p>Close to the CEO and decision rights, but collaborative with Finance, R&D, Operations, Regulatory, Commercial, HR and PMO.</p></div></div></Section>
<Section no="15" title="The leadership value"><div className="decision"><span className="tag">The intended outcome</span><h2>Make better enterprise choices—earlier, with stronger evidence and clearer accountability.</h2><div className="grid two" style={{marginTop:25}}><div className="card"><h3>For the CEO</h3><p>A coherent view of strategic progress, value creation, risks and decisions requiring attention.</p></div><div className="card"><h3>For C-level leaders</h3><p>Clear priorities, transparent trade-offs and a shared language for cross-functional performance.</p></div><div className="card"><h3>For the organization</h3><p>Less resource dilution, earlier bottleneck escalation and stronger alignment between activity and impact.</p></div><div className="card"><h3>For the future</h3><p>A scalable management system that learns, adapts and connects strategy to business results.</p></div></div></div></Section>
<footer className="footer">Executive discussion draft · Illustrative content only · Validate all data, targets, baselines and causal assumptions before formal use.</footer>
{edit&&<Editor d={d} set={set} arr={arr} upload={upload} reset={reset} close={()=>setEdit(false)} tab={tab} setTab={setTab}/>}
</div>}
function Section({no,title,lead,children}){return <section className="container section"><div className="section-head"><div className="section-no">{no}</div><h2>{title}</h2>{lead&&<p className="lead">{lead}</p>}</div>{children}</section>}
function Editor({d,set,arr,upload,reset,close,tab,setTab}){
const simple=(label,key,area=false)=><div className="field"><label>{label}</label>{area?<textarea value={d[key]} onChange={e=>set(key,e.target.value)}/>:<input value={d[key]} onChange={e=>set(key,e.target.value)}/>}</div>;
return <aside className="edit-panel"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><h2>Edit mode</h2><button className="btn" onClick={close}>✕</button></div><p style={{fontSize:12,color:"var(--muted)"}}>Edits are saved automatically in this browser.</p><div className="toolbar"><button className="btn" onClick={()=>setTab("core")}>Core text</button><button className="btn" onClick={()=>setTab("lists")}>Value map</button><button className="btn" onClick={()=>setTab("brand")}>Brand</button></div>
{tab==="core"&&<>{simple("Company","company")}{simple("Hero title","title")}{simple("Hero subtitle","subtitle",true)}{simple("Strategic question","question",true)}<h3>CEO/C-level jobs</h3>{d.ceoJobs.map((x,i)=><div className="admin" key={i}><div className="field"><label>Job</label><input value={x[0]} onChange={e=>arr("ceoJobs",i,[e.target.value,x[1]])}/></div><div className="field"><label>Explanation</label><textarea value={x[1]} onChange={e=>arr("ceoJobs",i,[x[0],e.target.value])}/></div></div>)}</>}
{tab==="lists"&&<><h3>Pains</h3>{d.pains.map((x,i)=><div className="field" key={i}><input value={x} onChange={e=>arr("pains",i,e.target.value)}/></div>)}<h3>Gains</h3>{d.gains.map((x,i)=><div className="field" key={i}><input value={x} onChange={e=>arr("gains",i,e.target.value)}/></div>)}<h3>Pain relievers</h3>{d.relievers.map((x,i)=><div className="admin" key={i}><input value={x[0]} onChange={e=>arr("relievers",i,[e.target.value,x[1]])}/><textarea value={x[1]} onChange={e=>arr("relievers",i,[x[0],e.target.value])}/></div>)}<h3>Gain creators</h3>{d.creators.map((x,i)=><div className="admin" key={i}><input value={x[0]} onChange={e=>arr("creators",i,[e.target.value,x[1]])}/><textarea value={x[1]} onChange={e=>arr("creators",i,[x[0],e.target.value])}/></div>)}</>}
{tab==="brand"&&<><p style={{fontSize:12,color:"var(--muted)"}}>Upload the official logo. It is stored locally in this browser.</p><label className="btn accent">Upload / replace logo<input type="file" accept="image/*" hidden onChange={upload}/></label>{d.logo&&<><br/><br/><button className="btn danger" onClick={()=>set("logo","")}>Remove logo</button></>}<h3>Reset</h3><button className="btn danger" onClick={reset}>Reset all content</button></>}
</aside>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
