<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>From Strategy to Business Value | AryoGen Proposal</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#102a43;--muted:#627d98;--bg:#f5f8fb;--card:#fff;--accent:#0b7285;--accent2:#2f9e44;--line:#d9e2ec;--gold:#d99a28;--shadow:0 18px 50px rgba(16,42,67,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.5px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px}.logo-placeholder{width:42px;height:42px;border:1px dashed var(--accent);border-radius:8px;display:grid;place-items:center;font-size:10px;color:var(--accent);text-align:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.accent{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:#b42318}
.hero{padding:90px 7vw 75px;background:linear-gradient(135deg,#edf7f8 0%,#fff 58%,#eef4fb 100%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:450px;height:450px;border-radius:50%;border:1px solid rgba(11,114,133,.15);right:-180px;top:-180px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h1{font-family:Manrope,sans-serif;font-size:clamp(40px,7vw,82px);line-height:1.02;letter-spacing:-3px;max-width:950px;margin:20px 0}.hero p{font-size:clamp(18px,2vw,25px);line-height:1.5;max-width:850px;color:#486581}.hero-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:40px;align-items:end}.hero-card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:25px;border-radius:18px}.hero-card strong{display:block;font-size:30px;margin-bottom:8px}.container{max-width:1250px;margin:auto;padding:70px 5vw}.section{position:relative}.section.hidden{display:none}.section-head{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:28px}.section-number{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:2px}.section h2{font-family:Manrope,sans-serif;font-size:clamp(28px,4vw,48px);letter-spacing:-1.5px;line-height:1.12;margin:8px 0 0}.lead{color:var(--muted);max-width:750px;line-height:1.7}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 8px 25px rgba(16,42,67,.035)}.card h3{margin:12px 0 9px;font-size:18px}.card p{color:var(--muted);line-height:1.65;margin:0}.icon{font-size:25px}.quote{font-family:Manrope;font-size:clamp(25px,4vw,45px);font-weight:700;line-height:1.25;border-left:4px solid var(--accent);padding-left:25px;max-width:1000px}.pill{display:inline-block;border-radius:30px;padding:7px 11px;background:#e5f5f7;color:var(--accent);font-size:12px;font-weight:800}.shift{display:grid;grid-template-columns:1fr 70px 1fr;align-items:stretch;gap:15px}.shift-box{padding:35px;border-radius:18px;background:white;border:1px solid var(--line)}.shift-box.active{background:var(--ink);color:white}.shift-box.active p{color:#d9e2ec}.arrow{display:grid;place-items:center;font-size:35px;color:var(--accent)}.capability{min-height:200px}.capability small{color:var(--accent);font-weight:800}.cycle{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:30px;background:white;border:1px solid var(--line);border-radius:18px}.cycle span{padding:13px 16px;border:1px solid #b8dfe4;border-radius:30px;background:#effafb;font-weight:700;font-size:13px}.cycle b{color:var(--accent)}.ebm{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.ebm .card{border-top:5px solid var(--accent)}.metric{font-size:30px;font-weight:800;font-family:Manrope}.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.phase{position:relative}.phase .phase-time{color:var(--accent);font-weight:800;font-size:13px}.phase ul{padding-left:20px;color:var(--muted);line-height:1.9}.pilot{background:linear-gradient(135deg,#102a43,#164e63);color:white;border-radius:22px;padding:38px}.pilot p,.pilot li{color:#d9e2ec}.pilot-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.org{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.org-box{padding:25px;border:1px solid var(--line);border-radius:16px;background:white;text-align:center}.org-box.ceo{background:var(--ink);color:white}.org-arrow{text-align:center;font-size:28px;color:var(--accent)}.decision{background:linear-gradient(135deg,#e5f5f7,#fff);border:1px solid #b8dfe4;border-radius:22px;padding:45px}.footer{padding:30px 5vw;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--line)}
.edit-panel{position:fixed;right:0;top:0;height:100vh;width:min(450px,100vw);background:white;z-index:50;box-shadow:-15px 0 50px rgba(0,0,0,.15);overflow:auto;padding:24px}.edit-panel h2{margin-top:0}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.field textarea{min-height:90px}.edit-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.section-admin{border:1px dashed var(--accent);padding:12px;border-radius:12px;margin-bottom:15px}.admin-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800}.presentation .topbar{display:none}.presentation .container{max-width:1400px;padding-top:90px;padding-bottom:90px}.print-only{display:none}
@media(max-width:850px){.hero-grid,.grid.two,.grid.three,.roadmap,.ebm,.pilot-grid,.org{grid-template-columns:1fr}.shift{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:35px}.topbar{align-items:flex-start;gap:10px;flex-direction:column}.toolbar{width:100%}.hero{padding-top:55px}.hero h1{letter-spacing:-1.5px}.section-head{display:block}.container{padding-top:45px;padding-bottom:45px}.cycle{justify-content:flex-start}.cycle b{display:none}}
@media print{.topbar,.edit-panel,.toolbar,.no-print{display:none!important}.hero{padding:35px;background:white}.container{padding:30px 0}.card,.hero-card{box-shadow:none;break-inside:avoid}.section{break-inside:avoid}.print-only{display:block}.footer{padding:15px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const initial = {
  logo:"", company:"AryoGen Pharmaceutical Company", title:"From Strategy to Business Value",
  subtitle:"Move from managing activities and projects to managing strategic outcomes and business value.",
  question:"How do we ensure AryoGen is not only doing more—but doing what matters most?",
  why:["Organizational complexity","Competing priorities","Limited resources","Industry uncertainty"],
  challenges:["Strategic alignment","Prioritization","Resource allocation","Fragmented information","Activity-versus-impact reporting","Bottleneck visibility"],
  capabilities:[
    ["🧭","Strategic Intelligence","Translate internal and external signals into decision-relevant insight."],
    ["🎯","Strategic Planning and OKRs","Convert corporate ambition into a small number of measurable priorities."],
    ["🧩","Strategic Portfolio and Resource Prioritization","Direct capacity, capital and talent toward the highest-value choices."],
    ["📈","Business Value Intelligence","Connect products, operations, cost, markets and profitability."],
    ["⚖️","Strategic Performance and Executive Decision Support","Give leadership a coherent view of progress, risks and choices."]
  ],
  cycle:["Strategy","Priorities","Portfolio","Resources","Execution","KPIs / EBM","Business Results","Adaptation"],
  ebm:[
    ["Current Value","What value are we delivering now?","Illustrative: revenue quality, contribution, customer outcomes."],
    ["Unrealized Value","What value could we unlock?","Illustrative: unmet demand, market access, pipeline potential."],
    ["Time-to-Market","How quickly can value be realized?","Illustrative: critical-path delays and launch readiness."],
    ["Ability to Innovate","How capable are we of creating future value?","Illustrative: capacity, learning, systems and talent."]
  ],
  pilot:["Product profitability","Cost per gram","Bottleneck impact","Portfolio visibility","Export-market analysis"],
  roadmap:[
    ["0–6 months","Diagnosis and Business Value Intelligence","Map decision needs, establish data definitions, build a pilot dashboard and test value hypotheses."],
    ["6–12 months","Strategy and OKR Management","Facilitate strategic choices, cascade OKRs and create a disciplined review cadence."],
    ["12–24 months","Integrated Reporting and Governance","Connect strategy, portfolio, resources, performance and executive decision forums."]
  ],
  target:["One coherent strategic direction","Transparent priorities and trade-offs","Evidence-based resource allocation","Outcome-focused performance conversations","Faster escalation of bottlenecks","A repeatable executive decision system"],
  decision:"Approve the establishment of a Corporate Strategy function reporting to the CEO—and authorize the launch of a six-month Business Value Intelligence pilot.",
  sections:["hero","question","why","challenges","shift","function","cycle","ebm","pilot","roadmap","target","org","decision"]
};
function App(){
 const [data,setData]=React.useState(()=>JSON.parse(localStorage.getItem("aryogenProposal")||"null")||initial);
 const [edit,setEdit]=React.useState(false),[presentation,setPresentation]=React.useState(false),[active,setActive]=React.useState("hero");
 const [logoPreview,setLogoPreview]=React.useState(data.logo);
 React.useEffect(()=>localStorage.setItem("aryogenProposal",JSON.stringify(data)),[data]);
 const update=(key,val)=>setData(d=>({...d,[key]:val}));
 const updateArray=(key,i,val)=>setData(d=>({...d,[key]:d[key].map((x,j)=>j===i?val:x)}));
 const move=(i,dir)=>{let a=[...data.sections],j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];update("sections",a)};
 const duplicate=(i)=>{let a=[...data.sections];a.splice(i+1,0,a[i]);update("sections",a)};
 const remove=(i)=>update("sections",data.sections.filter((_,j)=>j!==i));
 const reset=()=>{if(confirm("Reset all content to the original illustrative proposal?")){localStorage.removeItem("aryogenProposal");location.reload()}};
 const exportJSON=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aryogen-strategy-proposal.json";a.click()};
 const importJSON=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{setData(JSON.parse(r.result))}catch{alert("Invalid JSON file")}};r.readAsText(f)};
 const uploadLogo=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{update("logo",r.result);setLogoPreview(r.result)};r.readAsDataURL(f)};
 const visible=s=>data.sections.includes(s);
 return <div className={"app "+(presentation?"presentation":"")}>
 <header className="topbar no-print"><div className="brand">{data.logo?<img src={data.logo}/>:<div className="logo-placeholder">LOGO</div>}<div>{data.company}<div style={{fontSize:10,color:"var(--muted)",fontWeight:500}}>Executive Strategy Proposal</div></div></div>
 <div className="toolbar"><button className="btn" onClick={()=>setPresentation(!presentation)}>{presentation?"Exit presentation":"Fullscreen presentation"}</button><button className="btn" onClick={()=>window.print()}>Print / PDF</button><button className="btn" onClick={exportJSON}>Export JSON</button><label className="btn">Import JSON<input type="file" accept=".json" onChange={importJSON} hidden/></label><button className="btn primary" onClick={()=>setEdit(!edit)}>{edit?"Close editor":"Edit mode"}</button></div></header>
 {visible("hero")&&<section className="hero section"><div className="hero-grid"><div><div className="eyebrow">Corporate Strategy Proposal · 2026</div><h1>{data.title}</h1><p>{data.subtitle}</p><span className="pill">Illustrative proposal — not actual company data</span></div><div className="hero-card"><div className="eyebrow">The strategic ambition</div><strong>From activity to impact.</strong><p style={{color:"var(--muted)",lineHeight:1.6}}>A management system that helps leadership connect strategic choices to measurable business value.</p></div></div></section>}
 <main>
 {visible("question")&&<Section n="01" title="The strategic question"><div className="quote">{data.question}</div></Section>}
 {visible("why")&&<Section n="02" title="Why now" lead="The operating environment requires sharper choices, not simply more activity."><div className="grid four grid three">{data.why.map((x,i)=><div className="card" key={i}><div className="metric">0{i+1}</div><h3>{x}</h3><p>Requires explicit choices, ownership and measurable outcomes.</p></div>)}</div></Section>}
 {visible("challenges")&&<Section n="03" title="Current challenges" lead="The issue is not a lack of effort. It is the absence of an integrated mechanism for connecting effort to enterprise value."><div className="grid three">{data.challenges.map((x,i)=><div className="card" key={i}><span className="icon">◈</span><h3>{x}</h3><p>Illustrative challenge area requiring structured visibility and governance.</p></div>)}</div></Section>}
 {visible("shift")&&<Section n="04" title="The fundamental shift"><div className="shift"><div className="shift-box"><span className="pill">Today</span><h3>Activity Management</h3><p>Are tasks progressing? Are projects reporting? Are milestones being completed?</p></div><div className="arrow">→</div><div className="shift-box active"><span className="pill" style={{background:"#28566b",color:"white"}}>Target state</span><h3>Strategic Outcome Management</h3><p>Are we advancing the right outcomes? Is value being created? What should change?</p></div></div></Section>}
 {visible("function")&&<Section n="05" title="Proposed Corporate Strategy function" lead="A small, high-leverage function that turns strategic intent into aligned choices, evidence and executive action."><div className="grid three">{data.capabilities.map((c,i)=><div className="card capability" key={i}><div className="icon">{c[0]}</div><small>CAPABILITY 0{i+1}</small><h3>{c[1]}</h3><p>{c[2]}</p></div>)}</div></Section>}
 {visible("cycle")&&<Section n="06" title="Strategic management cycle" lead="A closed loop connecting strategic intent, execution evidence and adaptation."><div className="cycle">{data.cycle.map((x,i)=><React.Fragment key={i}><span>{x}</span>{i<data.cycle.length-1&&<b>→</b>}</React.Fragment>)}</div></Section>}
 {visible("ebm")&&<Section n="07" title="Evidence-Based Management framework" lead="Use four perspectives to avoid managing only what is easiest to count."><div className="ebm">{data.ebm.map((c,i)=><div className="card" key={i}><span className="pill">EBM {i+1}</span><h3>{c[0]}</h3><p>{c[1]}</p><br/><p><strong>Illustrative indicators:</strong><br/>{c[2]}</p></div>)}</div></Section>}
 {visible("pilot")&&<Section n="08" title="First proof of value"><div className="pilot"><span className="pill">Six-month pilot</span><h2 style={{color:"white",marginTop:15}}>Business Value Intelligence</h2><p>Build a focused evidence layer around decisions that materially affect product economics, operational capacity and market value.</p><div className="grid three">{data.pilot.map((x,i)=><div key={i} className="card"><h3>{x}</h3><p>Illustrative workstream; actual scope and data availability to be validated during diagnosis.</p></div>)}</div></div></Section>}
 {visible("roadmap")&&<Section n="09" title="Two-year roadmap"><div className="roadmap">{data.roadmap.map((p,i)=><div className="card phase" key={i}><div className="phase-time">{p[0]}</div><h3>{p[1]}</h3><p>{p[2]}</p><ul><li>Defined outputs</li><li>Named owners</li><li>Review cadence</li></ul></div>)}</div></Section>}
 {visible("target")&&<Section n="10" title="Target state after two years" lead="The function succeeds when it becomes part of how AryoGen makes choices—not merely another reporting layer."><div className="grid three">{data.target.map((x,i)=><div className="card" key={i}><div className="metric">✓</div><h3>{x}</h3></div>)}</div></Section>}
 {visible("org")&&<Section n="11" title="Proposed organizational position" lead="Corporate Strategy should sit close to enterprise decision rights, while remaining distinct from project delivery control."><div className="org"><div><div className="org-box ceo"><h3>CEO</h3><p style={{color:"#d9e2ec"}}>Enterprise direction and decision authority</p></div><div className="org-arrow">↓</div><div className="org-box"><h3>Corporate Strategy</h3><p>Strategy, intelligence, portfolio choices, business value and executive decision support</p></div></div><div className="card"><h3>Distinct from PMO</h3><p>PMO focuses primarily on delivery discipline, project governance, dependencies and execution visibility. Corporate Strategy focuses on enterprise choices, strategic coherence, value realization and adaptation.</p></div></div></Section>}
 {visible("decision")&&<Section n="12" title="Decision requested"><div className="decision"><span className="pill">Requested CEO decision</span><h2>{data.decision}</h2><p className="lead">The proposed pilot is intended to create tangible evidence, validate the operating model and inform the next stage of institutionalization.</p></div></Section>}
 </main><div className="footer">Prepared for executive discussion · All examples and metrics are illustrative and must be validated before use.</div>
 {edit&&<Editor data={data} update={update} updateArray={updateArray} move={move} duplicate={duplicate} remove={remove} uploadLogo={uploadLogo} reset={reset} close={()=>setEdit(false)}/>}
 </div>
}
function Section({n,title,lead,children}){return <section className="container section"><div className="section-head"><div><div className="section-number">{n}</div><h2>{title}</h2>{lead&&<p className="lead">{lead}</p>}</div></div>{children}</section>}
function Editor({data,update,updateArray,move,duplicate,remove,uploadLogo,reset,close}){
 const [tab,setTab]=React.useState("content");
 const simple=(label,key,area=false)=><div className="field"><label>{label}</label>{area?<textarea value={data[key]} onChange={e=>update(key,e.target.value)}/>:<input value={data[key]} onChange={e=>update(key,e.target.value)}/>}</div>;
 return <aside className="edit-panel"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><h2>Edit mode</h2><button className="btn" onClick={close}>✕</button></div><p style={{fontSize:12,color:"var(--muted)"}}>Changes are saved automatically to localStorage.</p><div className="toolbar"><button className="btn" onClick={()=>setTab("content")}>Content</button><button className="btn" onClick={()=>setTab("sections")}>Sections</button><button className="btn" onClick={()=>setTab("brand")}>Brand</button></div>
 {tab==="content"&&<>{simple("Company","company")}{simple("Hero title","title")}{simple("Hero subtitle","subtitle",true)}{simple("Strategic question","question",true)}
 <h3>Why now</h3>{data.why.map((x,i)=><div className="field" key={i}><input value={x} onChange={e=>updateArray("why",i,e.target.value)}/></div>)}
 <h3>Challenges</h3>{data.challenges.map((x,i)=><div className="field" key={i}><input value={x} onChange={e=>updateArray("challenges",i,e.target.value)}/></div>)}
 <h3>Capabilities</h3>{data.capabilities.map((c,i)=><div className="section-admin" key={i}><div className="field"><label>Icon</label><input value={c[0]} onChange={e=>updateArray("capabilities",i,[e.target.value,c[1],c[2]])}/></div><div className="field"><label>Title</label><input value={c[1]} onChange={e=>updateArray("capabilities",i,[c[0],e.target.value,c[2]])}/></div><div className="field"><label>Description</label><textarea value={c[2]} onChange={e=>updateArray("capabilities",i,[c[0],c[1],e.target.value])}/></div></div>)}
 <h3>Decision requested</h3>{simple("Decision text","decision",true)}</>}
 {tab==="sections"&&<>{data.sections.map((s,i)=><div className="section-admin" key={i}><div className="admin-title"><span>{i+1}. {s}</span><span>{["hero"].includes(s)?"":""}</span></div><div className="edit-row"><button className="btn" onClick={()=>move(i,-1)}>↑</button><button className="btn" onClick={()=>move(i,1)}>↓</button><button className="btn" onClick={()=>duplicate(i)}>Duplicate</button><button className="btn danger" onClick={()=>remove(i)}>Hide / delete</button></div></div>)}<p style={{fontSize:12,color:"var(--muted)"}}>To restore hidden sections, reset the proposal or edit the saved JSON.</p></>}
 {tab==="brand"&&<><h3>Logo</h3><p style={{fontSize:12,color:"var(--muted)"}}>Upload a transparent PNG/SVG or another suitable image. The current logo is stored locally in this browser.</p><label className="btn accent">Upload / replace logo<input type="file" accept="image/*" onChange={uploadLogo} hidden/></label>{data.logo&&<><br/><br/><button className="btn danger" onClick={()=>update("logo","")}>Remove logo</button></>}<h3>Data safety</h3><p style={{fontSize:12,color:"var(--muted)"}}>This prototype uses illustrative content only. Validate all numbers and claims before presenting them as company facts.</p><button className="btn danger" onClick={reset}>Reset all content</button></>}
 </aside>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
